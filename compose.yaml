services:
  cartochron:
    build: .
    user: "${CARTOCHRON_UID:?set to id -u}:${CARTOCHRON_GID:?set to id -g}"
    command: ["--bind", "0.0.0.0", "--port", "8765",
              "--db", "/data/observations.sqlite3", "--auth-file", "/data/auth"]
    ports:
      - "127.0.0.1:${CARTOCHRON_PORT:-8765}:8765"
    volumes:
      - type: bind
        source: "${CARTOCHRON_DATA_DIR:-./data}"
        target: /data
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
