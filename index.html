<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartochron</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <style>
    html,body{height:100%;margin:0;font:15px system-ui,sans-serif;background:#101820;color:#edf2f5}
    header{padding:14px 20px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
    h1{font-size:17px;margin:0} #status{color:#a9c3d1}
    #map{height:calc(100% - 62px);min-height:300px}
    code{font-size:13px} footer{display:none}
    @media (max-width:500px){header{padding:12px}#map{height:calc(100% - 90px)}}
  </style>
</head>
<body>
  <header><h1>Cartochron</h1><span id="status" aria-live="polite">Waiting for an observation</span></header>
  <main id="map" aria-label="Map of manually submitted coordinates"></main>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([0,0], 2);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19, referrerPolicy:'strict-origin-when-cross-origin', attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);
    const trail = L.polyline([], {weight:3}).addTo(map);
    let marker = null, lastKey = '', first = true;
    async function refresh() {
      try {
        const r = await fetch('/api/points', {cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        const {points} = await r.json();
        const current = points.at(-1);
        document.querySelector('#status').textContent = current
          ? `${points.length} observation(s) · Last: ${current.time} · ${current.lat.toFixed(6)}, ${current.lon.toFixed(6)}`
          : 'Waiting for an observation';
        if(!current) return;
        const key = JSON.stringify(current) + ':' + points.length;
        if(key === lastKey) return;
        lastKey = key;
        trail.setLatLngs(points.map(p => [p.lat,p.lon]));
        // A vector marker avoids Leaflet's external marker-icon.png asset,
        // which our deliberately restrictive CSP does not permit.
        if(!marker) marker = L.circleMarker([current.lat,current.lon], {
          radius:7, weight:2, color:'#fff', fillColor:'#1976d2', fillOpacity:1
        }).addTo(map);
        else marker.setLatLng([current.lat,current.lon]);
        if(first) { map.setView([current.lat,current.lon], 15); first = false; }
      } catch(err) {
        document.querySelector('#status').textContent = 'Map server unavailable: '+err.message;
      }
    }
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
