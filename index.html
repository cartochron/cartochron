<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartochron</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <style>
    :root {color-scheme:dark; font:14px system-ui,sans-serif; background:#101820; color:#edf2f5}
    * {box-sizing:border-box}
    html,body {height:100%; margin:0}
    body {display:flex; flex-direction:column}
    header {padding:12px 16px; background:#14212b; border-bottom:1px solid #385061}
    .top {display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
    .brand {display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
    h1 {font-size:18px; margin:0; letter-spacing:.03em}
    #status, #detail, #page-status, #compare-status {color:#bdd0db; font-variant-numeric:tabular-nums}
    .controls, #history-controls, #inspect {display:flex; align-items:center; flex-wrap:wrap; gap:10px}
    #history-controls, #monitor-controls {margin-top:10px}
    #monitor-controls {display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    #monitor-count {font-size:12px;color:#bdd0db}
    #place-panel {margin-top:10px;padding:10px;background:#1a2b36;border:1px solid #456273;border-radius:6px}
    #place-panel .controls {margin-bottom:8px}
    #place-results {margin:5px 0;max-height:115px;overflow:auto;padding-left:22px;font-size:12px}
    #place-status {font-size:12px;color:#bdd0db}
    #layers-panel {display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-top:10px;padding:10px;background:#1a2b36;border:1px solid #456273;border-radius:6px}
    #layers-list {display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:100%}
    .track-layer {border:1px solid #456273;border-radius:5px;padding:5px 8px;max-width:240px}
    .track-layer span {overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .track-layer input {accent-color:#8724d5}
    #inspect, #time-panel {padding:9px 16px; background:#14212b; border-top:1px solid #385061}
    #time-panel {display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    #time-panel input {flex:1;min-width:150px}
    #time-value, #time-results {font-size:12px;color:#bdd0db}
    #time-results {display:flex;gap:8px;flex-wrap:wrap}
    .time-result {border:1px solid #456273;border-radius:4px;padding:3px 6px}
    #inspect input {flex:1; min-width:140px}
    label {display:flex; align-items:center; gap:7px; color:#bdd0db}
    input,button,select {font:inherit; border:1px solid #536b7b; border-radius:5px; color:#edf2f5; background:#213441; padding:7px 9px}
    button {cursor:pointer}
    button:hover {background:#345064}
    button[aria-pressed="true"] {background:#155884; border-color:#4ca8e6}
    button:focus-visible,input:focus-visible,select:focus-visible {outline:2px solid #78baf2; outline-offset:2px}
    #map {flex:1; min-height:280px; background:#18242d}
    #track {max-width:400px}
    #status {font-size:12px}
    #feed-state {font-size:12px; padding:3px 7px; border:1px solid #536b7b;
      border-radius:5px; color:#dae4eb; white-space:nowrap}
    #feed-state[data-state="recent"] {border-color:#3b8d78; color:#a9e7c8}
    #feed-state[data-state="stale"] {border-color:#b88b55; color:#ffd39e}
    #feed-state[data-state="unknown"] {border-color:#b88b55; color:#ffd39e}
    .help-link {color:#94d9ff;font-size:12px;text-decoration:underline;text-underline-offset:3px}
    #detail {min-width:240px; font-size:12px}
    #gap-status {font-size:12px; color:#f2d6ff}
    #page-status, #compare-status {font-size:12px}
    [hidden] {display:none!important}
    @media(max-width:650px) {
      header {padding:10px}
      .top {align-items:flex-start}
      #history-controls label {flex:1; min-width:165px}
      #history-controls input {width:100%; min-width:0}
      #inspect {padding:10px}
      #detail {width:100%}
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="brand"><h1>Cartochron</h1><span id="feed-state" data-state="unknown">Checking receipts</span><span id="status" role="status">Connecting…</span><a class="help-link" href="/help" target="_blank" rel="noopener">Help / Manual</a></div>
      <div class="controls">
        <label><span id="selection-label">Source / channel</span> <select id="track" aria-label="Monitored source or channel"><option>Loading…</option></select></label>
        <div class="controls" aria-label="Map mode">
          <button id="live" type="button" aria-pressed="true">Monitor</button>
          <button id="history" type="button" aria-pressed="false">History</button>
        </div>
      </div>
    </div>
    <div id="monitor-controls" class="controls">
      <label>Camera <select id="camera" aria-label="Monitor camera mode">
        <option value="free" selected>Free (no auto-move)</option>
        <option value="selected">Follow selected</option>
        <option value="visible">Follow visible</option>
      </select></label>
      <button id="fit-visible" type="button">Fit visible</button>
      <label><input id="show-inactive" type="checkbox">Show inactive positions</label>
      <span id="monitor-count" aria-live="polite"></span>
    </div>
    <div id="history-controls" hidden>
      <label>Browse <select id="history-filter" aria-label="Filter recording runs">
        <option value="">All recordings</option>
      </select></label>
      <button id="older-runs" type="button" hidden>Older recordings</button>
      <span id="runs-status"></span>
      <label>From <input id="from" type="datetime-local" step="1"></label>
      <label>To <input id="to" type="datetime-local" step="1"></label>
      <button id="apply" type="button">Show interval</button>
      <button id="more" type="button" hidden>Load more</button>
      <button id="layers-toggle" type="button" aria-expanded="false" aria-controls="layers-panel">Tracks <span id="layer-count">1 visible</span></button>
      <button id="place-toggle" type="button" aria-expanded="false" aria-controls="place-panel">Inspect place</button>
      <span id="compare-status" aria-live="polite"></span>
      <span id="page-status" aria-live="polite"></span>
    </div>
    <div id="layers-panel" hidden>
      <div id="layers-list" role="group" aria-label="Visible comparison tracks"></div>
      <label>Comparison time <select id="compare-time" aria-label="Comparison time range">
        <option value="all">Entire runs (spatial)</option>
        <option value="interval">Same interval</option>
      </select></label>
      <small>Focused track stays visible. Select up to three more runs.</small>
    </div>
    <div id="place-panel" hidden>
      <div class="controls"><strong>Place inspector</strong>
        <label>Radius <select id="place-radius" aria-label="Place search radius">
          <option value="50">50 m</option><option value="100" selected>100 m</option>
          <option value="250">250 m</option>
        </select></label>
        <span id="place-status">Click a location on the map to inspect loaded observations.</span>
      </div>
      <ol id="place-results" aria-label="Chronological observations near selected place"></ol>
      <small>Recorded proximity does not establish presence between fixes or intent.</small>
    </div>
  </header>
  <main id="map" aria-label="GPS observation map"></main>
  <div id="inspect" hidden>
    <output id="gap-status" aria-live="polite"></output>
    <label for="position" title="Click a route dot or line to inspect a recorded point">Inspect point</label>
    <input id="position" type="range" min="0" value="0" aria-label="Position on historical track">
    <output id="detail" for="position"></output>
  </div>
  <div id="time-panel" hidden>
    <label for="time-cursor">Shared time</label>
    <input id="time-cursor" type="range" min="0" max="1000" value="500" aria-label="Shared timeline position">
    <output id="time-value" for="time-cursor"></output>
    <div id="time-results" aria-live="polite"></div>
  </div>
  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/viewer.js"></script>
</body>
</html>
